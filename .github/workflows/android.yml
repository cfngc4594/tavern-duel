name: Android candidate APK
on:
  workflow_dispatch:
    inputs:
      privacy_test:
        description: 'Build a separate black-screen, muted device-test app'
        type: boolean
        default: false
  push:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVACY_TEST: ${{ inputs.privacy_test && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check shared Forward+ renderer policy
        run: |
          python ci/renderer_policy.py project.godot
          python ci/test_renderer_policy.py
          python ci/test_configure_export.py
          python tests/verify_renderer_benchmark_test.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install tools
        shell: bash
        run: |
          sdkmanager "build-tools;35.0.0" "platforms;android-36"
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          cp /tmp/templates/templates/android_debug.apk "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
      - name: Configure isolated CI export
        run: python3 ci/configure_export.py
      - name: Import and export
        shell: bash
        run: |
          mkdir -p build
          Godot_v4.7.1-stable_linux.x86_64 --headless --editor --import --path . > build/import.log 2>&1
          python3 ci/run_regression_tests.py Godot_v4.7.1-stable_linux.x86_64 shared_ui_policy_test.gd phone_camera_policy_test.gd source_phone_controller_test.gd touch_input_test.gd phone_spell_input_test.gd combat_seek_context_test.gd renderer_benchmark_metrics_test.gd privacy_test_guard_test.gd phone_hand_math_test.gd phone_hand_game_test.gd character_stat_visibility_test.gd phone_board_actors_test.gd coin_allocation_test.gd coin_flow_test.gd archer_source_test.gd archer_audio_gate_test.gd archer_death_audio_gate_test.gd phone_battlecry_placement_test.gd phone_battlecry_preview_test.gd battlecry_release_sequence_test.gd phone_layout_cache_test.gd phone_particle_batch_test.gd phone_environment_particles_test.gd transmission_sync_cache_test.gd phone_particle_draw_snapshot_test.gd source_phone_board_layout_test.gd phone_mana_controller_test.gd phone_mana_controller_live_test.gd phone_mana_live_test.gd phone_mana_overflow_test.gd phone_mana_renderer_test.gd source_mana_spend_test.gd desktop_draw_cache_test.gd summon_constant_step_test.gd summon_color_snapshot_test.gd summon_size_snapshot_test.gd summon_fraction_step_test.gd summon_uv_snapshot_test.gd summon_constant_plan_test.gd transmission_base_storage_test.gd desktop_unit_shadow_pixel_test.gd
          python3 ci/run_privacy_guard_test.py Godot_v4.7.1-stable_linux.x86_64
          Godot_v4.7.1-stable_linux.x86_64 --headless --path . --export-debug "Android Playtest" "$PWD/build/unsigned.apk" > build/export.log 2>&1
      - name: Preserve raw runtime assets and sign
        shell: bash
        run: |
          python3 ci/verify_apk.py build/unsigned.apk . build/unsigned-check.json || test -f build/unsigned-check.json
          python3 ci/add_raw_assets.py build/unsigned.apk . build/unsigned-check.json
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -P 16 4 build/unsigned.apk build/aligned.apk
          keytool -genkeypair -noprompt -keystore /tmp/candidate.keystore -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 30
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/candidate.keystore --ks-pass pass:android --key-pass pass:android --out build/TavernDuel-latest-candidate.apk build/aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs build/TavernDuel-latest-candidate.apk > build/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 build/TavernDuel-latest-candidate.apk
          python3 ci/verify_apk.py build/TavernDuel-latest-candidate.apk . build/verification.json
          sha256sum build/TavernDuel-latest-candidate.apk > build/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: TavernDuel-latest-candidate${{ inputs.privacy_test && '-privacy' || '' }}
          path: |
            build/TavernDuel-latest-candidate.apk
            build/SHA256SUMS
            build/verification.json
            build/signature.txt
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: build/*.log
          retention-days: 3
